[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clamshield-hestia"
version = "1.11.6"
description = "Website and email protection integrated with Hestia without vendor patches"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
clamshield = "clamshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
