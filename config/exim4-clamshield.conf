# Managed by clamshield
[Service]
RuntimeDirectory=clamshield-exim
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=no
# Native generation is independent of the optional addon helper. The explicit
# output keeps native template/admin changes effective with our owned selector.
ExecStartPre=/usr/sbin/update-exim4.conf $UPEX4OPTS --output /run/clamshield-exim/native.conf
ExecStartPre=-/usr/bin/timeout --kill-after=1s 8s /usr/bin/python3 -I -B /opt/clamshield-mail/native_fallback.py
ExecStartPre=-/usr/bin/timeout --kill-after=1s 10s /usr/local/hestia/bin/v-clamshield mail-startup
ExecReload=
ExecReload=/usr/bin/rm -f /run/clamshield-exim/hook.conf /run/clamshield-exim/policy.conf /run/clamshield-exim/native-source.conf
ExecReload=/usr/sbin/update-exim4.conf $UPEX4OPTS --output /run/clamshield-exim/native.conf
ExecReload=-/usr/bin/timeout --kill-after=1s 8s /usr/bin/python3 -I -B /opt/clamshield-mail/native_fallback.py
ExecReload=-/usr/bin/timeout --kill-after=1s 10s /usr/local/hestia/bin/v-clamshield mail-startup
ExecReload=kill -HUP $MAINPID
