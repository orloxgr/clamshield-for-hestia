name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Ubuntu test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-plyara python3-pymysql mariadb-server clamav clamav-daemon yara gnupg rsync gcc libc6-dev php-cli spamassassin spamd exim4-daemon-heavy util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Linux engine and application tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install DOM test dependencies
        working-directory: tests/ui
        run: npm ci
      - name: Run DOM tests
        working-directory: tests/ui
        run: npm test
